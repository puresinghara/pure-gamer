ent” With Massive Ripple Effects", "thai_title": "ปรากฏการณ์ GTA 6: เมื่อเกมระดับบล็อกบัสเตอร์กลายเป็น 'อีเวนต์ระดับโลก' ที่สั่นสะเทือนเศรษฐกิจ", "tag": "GlobalNews", "sub_tag": "GTA", "source_name": "GameSpot", "sources": [{"name": "GameSpot", "url": "https://www.gamespot.com/articles/gta-6-is-like-the-olympics-a-rare-cultural-moment-with-massive-ripple-effects/"}], "bullet_points": ["GTA 6 เตรียมวางจำหน่ายในวันที่ 19 พฤศจิกายนนี้ ท่ามกลางความคาดหวังว่าจะเป็นเกมที่สร้างแรงกระเพื่อมมหาศาลต่ออุตสาหกรรมบันเทิง", "ผู้เชี่ยวชาญจาก PwC เปรียบเทียบการเปิดตัวเกมนี้ว่าเป็น 'ปรากฏการณ์ทางวัฒนธรรม' ที่เทียบเท่ากับการแข่งขันโอลิมปิก", "คาดการณ์ว่าอาจมีผู้เล่นลาหยุดงานเพื่อเล่นเกมนี้เพิ่มขึ้น 9% ถึง 17% ส่งผลกระทบต่อกิจกรรมทางเศรษฐกิจอื่นๆ ในช่วงเวลาดังกล่าว", "ยอดพรีออเดอร์ที่พุ่งสูงถึง 11 ล้านชุด และคาดว่าจะแตะ 25 ล้านชุดในวันเปิดตัว ซึ่งอาจทำรายได้สูงถึง 2 พันล้านดอลลาร์สหรัฐ"], "full_paragraphs": ["นับถอยหลังสู่การมาถึงของ Grand Theft Auto 6 ผลงานฟอร์มยักษ์จาก Rockstar Games ที่มีกำหนดวางจำหน่ายในวันที่ 19 พฤศจิกายนนี้ ซึ่งล่าสุดสื่อเกมชั้นนำอย่าง GameSpot ได้รายงานว่า แรงสั่นสะเทือนจากการเปิดตัวครั้งนี้ไม่ได้จำกัดอยู่แค่ในวงการเกมเท่านั้น แต่กำลังกลายเป็น 'ปรากฏการณ์ทางวัฒนธรรม' ที่ส่งผลกระทบต่ออุตสาหกรรมบันเทิงในวงกว้าง จนถึงขั้นที่ค่ายเกมอื่นๆ ต้องพากันขยับตารางวางจำหน่ายเกมของตนเพื่อหลีกทางให้กับรัศมีการทำลายล้างของเกมนี้", "Bart Spiegel ผู้เชี่ยวชาญจากบริษัทที่ปรึกษาระดับโลกอย่าง PwC ได้ให้สัมภาษณ์กับ GameSpot โดยเปรียบเทียบการเปิดตัว GTA 6 ว่ามีความสำคัญเทียบเท่ากับการแข่งขันโอลิมปิก เนื่องจากเป็นเหตุการณ์ที่ดึงดูดความสนใจจากผู้คนทั่วโลกได้อย่างมหาศาลและต่อเนื่องยาวนาน ไม่ใช่แค่เพียงชั่วข้ามคืน โดยคาดการณ์ว่าผู้เล่นจะใช้เวลาไปกับเกมนี้ยาวนานหลายเดือน ซึ่งอาจส่งผลให้กิจกรรมบันเทิงอื่นๆ เช่น การรับชมโทรทัศน์ หรือการออกไปใช้บริการนอกบ้านลดน้อยลงในช่วงเวลาดังกล่าว", "ในแง่ของผลกระทบทางเศรษฐกิจ มีการประเมินว่าอัตราการลาหยุดงานในช่วงที่เกมวางจำหน่ายอาจสูงกว่าปกติถึง 9% ถึง 17% ซึ่งสะท้อนให้เห็นถึงความต้องการของผู้บริโภคที่ให้ความสำคัญกับประสบการณ์ความบันเทิงระดับพรีเมียมนี้ ิญในยุคปัจจุบัน", "ตามรายงานจากสื่อเกมญี่ปุ่นอย่าง Automaton JP ระบุว่า นักพัฒนาผู้เสียหายรายนี้ไม่ได้นิ่งเฉยต่อเหตุการณ์ที่เกิดขึ้น เขาตัดสินใจควักเงินส่วนตัวซื้อคีย์เกมของตัวเองจากเว็บไซต์ดังกล่าว เพื่อแกะรอยและตรวจสอบที่มาของคีย์เหล่านั้น จนกระทั่งสามารถระบุตัวตนของผู้ที่นำคีย์ไปขายต่อได้อย่างชัดเจน", "เมื่อสืบสวนจนพบต้นตอของปัญหา นักพัฒนาผู้นี้ได้ดำเนินการขั้นเด็ดขาดกับผู้กระทำผิด โดยการตัดสิทธิ์การเข้าถึงเครื่องมือแจกจ่ายคีย์เกมสำหรับอุตสาหกรรม (Industry Key Distribution Tool) ของบุคคลดังกล่าวอย่างถาวร เพื่อป้องกันไม่ให้เกิดการนำคีย์ไปแสวงหาผลประโยชน์ในลักษณะนี้ได้อีกในอนาคต", "เหตุการณ์นี้ถือเป็นบทเรียนสำคัญสำหรับนักพัฒนาเกมในการบริหารจัดการคีย์เกมให้รัดกุมยิ่งขึ้น แม้ว่าการสืบสวนด้วยตัวเองจะเป็นวิธีที่เสี่ยงและต้องใช้ความพยายามสูง แต่การจัดการอย่างเด็ดขาดของนักพัฒนาท่านนี้ก็ถือเป็นตัวอย่างที่ดีในการปกป้องทรัพย์สินทางปัญญาของตนเองจากตลาดมืดที่คอยเอาเปรียบคนทำเกม"], "link": "https://automaton-media.com/articles/newsjp/20261116-479415/", "canonical_link": "https://automaton-media.com/articles/newsjp/20261116-479415", "cover_image_url": "https://automaton-media.com/wp-content/uploads/2026/11/20261116-479415-header.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794810000, "published_at": "2026-11-16T06:20:00Z", "published_th": "16 พ.ย. 2026 • 13:20 น.", "category_hint": "JapanNews"}, {"id": 1794814296583, "guid": "https://www.gematsu.com/?p=1088361", "original_title": "This Week’s Japanese Game Releases: Grand Theft Auto VI, more", "thai_title": "สัปดาห์แห่งความเดือด! สรุปรายชื่อเกมใหม่วางจำหน่ายในญี่ปุ่น นำทัพโดย Grand Theft Auto VI", "tag": "JapanNews", "sub_tag": "GTA", "source_name": "Gematsu", "sources": [{"name": "Gematsu", "url": "https://www.gematsu.com/2026/11/this-weeks-japanese-game-releases-grand-theft-auto-vi-more"}], "bullet_points": ["Grand Theft Auto VI ขึ้นแท่นไฮไลท์เกมฟอร์มยักษ์ประจำสัปดาห์สำหรับฝั่งญี่ปุ่น", "ทัพเกมใหม่ลงแพลตฟอร์ม PS5 และ Xbox Series หลากหลายแนว", "มีเกมที่น่าสนใจอย่าง God of War: Sons of Sparta และ Soul Reaver 2 ร่วมวางจำหน่าย", "ครอบคลุมการวางจำหน่ายทั้งบนคอนโซลรุ่นปัจจุบันและ PC"], "full_paragraphs": ["เข้าสู่ช่วงเวลาที่เกมเมอร์ทั่วโลกต่างเฝ้ารอ โดยเฉพาะในตลาดญี่ปุ่นที่สัปดาห์นี้ถือเป็นช่วงเวลาสำคัญของการวางจำหน่ายเกมระดับแม่เหล็ก ข้อมูลจากรายงานล่าสุดของ Gematsu ยืนยันว่า Grand Theft Auto VI คือหัวหอกหลักที่จะมาสร้างแรงสั่นสะเทือนให้กับวงการเกมในสัปดาห์นี้ ทั้งบนแพลตฟอร์ม PlayStation 5 และ Xbox Series", "นอกเหนือจากเกมฟอร์มยักษ์จาก Rockstar Games แล้ว ยังมีลิสต์เกมที่น่าสนใจอีกมากมายที่เตรียมตบเท้าเข้าสู่ตลาดญี่ปุ่น ไม่ว่าจะเป็นการพอร์ตลงเครื่อง PlayStation 5 ของเกมอย่าง Duck Side of the Moon, Moonlight Peaks และ POPUCOM รวมถึงการมาถึงของ God of War: Sons of Sparta บนเครื่อง PlayStation 4 ที่แฟนเกมคลาสสิกไม่ควรพลาด", "ในฝั่งของ PC ก็มีความเคลื่อนไหวที่น่าจับตามองเช่นกัน โดยมีการเปิดตัว Volvy’s Adventure: Reslimed และการเข้าสู่ช่วง Early Access ของเกม HARMA บน Steam นอกจากนี้ยังมีเกมที่วางจำหน่ายแบบมัลติแพลตฟอร์มอย่าง Soul Reaver 2 ที่ลงให้กับทั้ง PS5 และ PS4 รวมถึง Unicorn Academy: Island of Magic ที่รองรับทั้งคอนโซลและ PC", "สำหรับผู้ที่มองหาเกมบนเครื่อง Nintendo Switch และ Switch 2 ก็มีรายชื่อเกมอย่าง Reverie in the Moonlight และ Spirit Crossing ที่พร้อมวางจำหน่ายทั่วโลกเช่นกัน ถือเป็นสัปดาห์ที่คึกคักและมีตัวเลือกหลากหลายสำหรับเกมเมอร์ทุกกลุ่ม ไม่ว่าคุณจะชื่นชอบเกมระดับ AAA หรือเกมอินดี้ที่น่าสนใจก็ตาม"], "link": "https://www.gematsu.com/2026/11/this-weeks-japanese-game-releases-grand-theft-auto-vi-more", "canonical_link": "https://www.gematsu.com/2026/11/this-weeks-japanese-game-releases-grand-theft-auto-vi-more", "cover_image_url": "https://www.gematsu.com/wp-content/uploads/2026/11/Weekly-Japanese-Game-Releases_11-15-26.jpg", "gallery_images": [], "videos": [], "review_score": "", "published_ts": 1794798560, "published_at": "2026-11-16T03:09:20Z", "published_th": "16 พ.ย. 2026 • 10:09 น.", "category_hint": "JapanNews"}, {"id": 1794814296585, "guid": "https://jp.ign.com/metal-gear-solid-2-son-of-liberty/84610/252020", "original_title": "25年前、小島秀夫は2020年代にこそふさわしい完璧な「メタルギア ソリッド」を作っていた", "thai_title": "ย้อนรอย 25 ปี Metal Gear Solid 2: ผลงานมาสเตอร์พีซของ Hideo Kojima ที่ทำนายอนาคตได้แม่นยำกว่าใคร", "tag": "JapanNews", "sub_tag": "METAL GEAR", "source_name": "IGN Japan", "sources": [{"name": "IGN Japan", "url": "https://jp.ign.com/metal-gear-solid-2-son-of-liberty/84610/252020"}], "bullet_points": ["Metal Gear Solid 2: Sons of Liberty ครบรอบ 25 ปี พร้อมการวิเคราะห์ว่าเนื้อหาในเกมสะท้อนสังคมยุค 2020 ได้อย่างน่าขนลุก", "ตัวเกมนำเสนอประเด็นการควบคุมข้อมูล, AI, และการบิดเบือนความจริงผ่านสื่อดิจิทัล ซึ่งเป็นปัญหาหลักในโลกปัจจุบัน", "ระบบการเล่นแบบ Meta-structure ที่ตั้งคำถามต่อตัวผู้เล่น ถูกยกย่องว่าเป็นงานศิลปะที่ล้ำหน้ากว่ายุคสมัย", "บทสรุปของเกมยังคงทรงพลังในการสอนให้ผู้เล่นรู้จักตั้งคำถามและเลือกเส้นทางชีวิตของตนเองท่ามกลางกระแสข้อมูลล้นหลาม"], "full_paragraphs": ["หากพูดถึงเกมที่ก้าวข้ามขีดจำกัดของความเป็นสื่อบันเทิงไปสู่การเป็นงานศิลปะเชิงปรัชญา คงไม่มีใครปฏิเสธชื่อของ Metal Gear Solid 2: Sons of Liberty ผลงานระดับตำนานจาก Hideo Kojima ที่วางจำหน่ายครั้งแรกเมื่อปี 2001 ล่าสุดทาง IGN Japan ได้เผยบทวิเคราะห์เจาะลึกถึงความสำคัญของเกมนี้ในวาระครบรอบ 25 ปี โดยชี้ให้เห็นว่าสิ่งที่ Kojima ได้ถ่ายทอดไว้ในอดีต ไม่ได้เป็นเพียงแค่เรื่องราวสายลับทั่วไป แต่เป็นการคาดการณ์ถึงสังคมยุคดิจิทัลที่เต็มไปด้วยการบิดเบือนข้อมูลและอิทธิพลของ AI ได้อย่างแม่นยำจนน่าตกใจ", "ในยุคที่เกมวางจำหน่ายครั้งแรก Metal Gear Solid 2 เคยได้รับเสียงวิจารณ์ที่แตกออกเป็นสองฝั่ง ทั้งจากการเปลี่ยนตัวเอกมาเป็น Raiden แทนที่ Solid Snake และเนื้อหาที่ซับซ้อนเกินคาดเดา แต่เมื่อเวลาผ่านไป สิ่งที่เคยถูกมองว่ายากเกินเข้าใจกลับกลายเป็นกระจกสะท้อนสังคมปัจจุบันได้อย่างชัดเจน ไม่ว่าจะเป็นเรื่องของ 'The Patriots' องค์กรลึกลับที่ควบคุมข้อมูลข่าวสารผ่านระบบ AI หรือการสร้างสถานการณ์จำลองเพื่อชี้นำความคิดของผู้คน ซึ่งสอดคล้องกับสถานการณ์ข่าวปลอม (Fake News) และการใช้โซเชียลมีเดียในยุคปัจจุบันอย่างหลีกเลี่ยงไม่ได้", "จุดเด่นที่ทำให้เกมนี้ยังคงถูกพูดถึงคือการใช้เทคนิค Meta-structure ที่ Kojima จงใจทำลายกำแพงระหว่างเกมกับผู้เล่น เช่น การแสดงผลหน้าจอ 'Mission Failed' หลอกผู้เล่น หรือการตั้งคำถามถึงอิสระในการตัดสินใจของมนุษย์ภายใต้การควบคุมของระบบ ซึ่งถือเป็นแนวคิดที่ล้ำสมัยมากในขณะนั้น ก่อนที่เกมอย่าง BioShock หรือ Spec Ops: The Line จะนำแนวทางนี้ไปต่อยอดในเวลาต่อมา ทำให้ Metal Gear Solid 2 ไม่ใช่แค่เกมแนว Tactical Espionage Action แต่เป็นบทเรียนเชิงสังคมที่เข้มข้น", "แม้ในปัจจุบัน Hideo Kojima จะก้าวไปสู่โปรเจกต์ใหม่ๆ อย่าง Death Stranding หรือเกมสายลับโปรเจกต์ใหม่อย่าง PHYSINT แต่การกลับมามองย้อนดู Metal Gear Solid 2 ในปี 2026 นี้ ทำให้เราเห็นว่าหัวใจสำคัญของเกมไม่ได้อยู่ที่ความล้ำของกราฟิก แต่อยู่ที่ข้อความที่ส่งถึงผู้เล่นว่า 'จงมองหาความจริงด้วยตัวเอง' ท่ามกลางโลกที่เต็มไปด้วยข้อมูลลวง นี่คือบทพิสูจน์ว่าทำไม Kojima ถึงยังคงเป็นหนึ่งในนักสร้างเกมที่ทรงอิทธิพลที่สุดในโลก และทำไมเกมเมอร์ยุคใหม่ควรหาโอกาสสัมผัสผลงานชิ้นนี้สักครั้ง"], "link": "https://jp.ign.com/metal-gear-solid-2-son-of-liberty/84610/252020", "canonical_link": "https://jp.ign.com/metal-gear-solid-2-son-of-liberty/84610/252020", "cover_image_url": "https://sm.ign.com/t/ign_jp/feature/2/25-years-a/25-years-ago-kojima-made-the-perfect-metal-gear-solid-for-th_e4r3.1200.jpg", "gallery_images": ["https://sm.ign.com/ign_jp/photo/2/25-years-a/25-years-ago-kojima-made-the-perfect-metal-gear-solid-for-th_4byq.jpg", "https://sm.ign.com/ign_jp/photo/2/25-years-a/25-years-ago-kojima-made-the-perfect-metal-gear-solid-for-th_n8rr.jpg"], "videos": [], "review_score": "", "published_ts": 1794797544, "published_at": "2026-11-16T02:52:24Z", "published_th": "16 พ.ย. 2026 • 09:52 น.", "category_hint": "JapanNews"}, {"id": 1794814341222, "guid": "1943734", "original_title": "The Zelda: Ocarina Of Time Remake Shows That A Masterpiece Is Ageless", "thai_title": "The Legend of Zelda: Ocarina of Time ฉบับรีเมคบน Switch 2: การกลับมาของตำนานที่กาลเวลาทำอะไรไม่ได้", "tag": "GlobalReview", "sub_tag": "ZELDA", "source_name": "GameSpot", "sources": [{"name": "GameSpot", "url": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless/"}, {"name": "Eurogamer", "url": "https://www.eurogamer.net/the-legend-of-zelda-ocarina-of-time-remake-review"}], "bullet_points": ["การกลับมาของผลงานระดับมาสเตอร์พีซที่คงความคลาสสิกไว้ครบถ้วนบนเครื่อง Switch 2", "ยกระดับงานภาพและเสียงใหม่ทั้งหมด พร้อมระบบควบคุมกล้องแบบอิสระที่ทันสมัย", "เพิ่มระบบพากย์เสียงตัวละครเต็มรูปแบบ ช่วยเสริมมิติให้กับเนื้อเรื่องและตัวละคร", "ยังคงรักษาหัวใจสำคัญของเกมเพลย์ต้นฉบับปี 1998 ไว้ได้อย่างสมบูรณ์แบบ"], "full_paragraphs": ["การกลับมาของ The Legend of Zelda: Ocarina of Time บนเครื่อง Switch 2 ไม่ใช่แค่การนำเกมเก่ามาปัดฝุ่นใหม่ แต่เป็นการพิสูจน์ว่ารากฐานการออกแบบเกมระดับตำนานนั้นมีความเป็นอมตะเพียงใด ตามรายงานจาก GameSpot และ Eurogamer ระบุว่านี่คือการรีเมคที่เคารพต้นฉบับอย่างสูงสุด โดยยังคงความรู้สึกของการผจญภัยใน Hyrule ที่แฟนเกมคุ้นเคย แต่ถูกยกระดับด้วยเทคโนโลยีสมัยใหม่ที่ทำให้ประสบการณ์การเล่นดูสดใหม่และน่าตื่นตาตื่นใจสำหรับทั้งแฟนรุ่นเก๋าและผู้เล่นหน้าใหม่", "ในด้านงานภาพและเสียง สื่ออย่าง GameSpot ชื่นชมว่านี่คือหนึ่งในเกมที่สวยที่สุดบน Switch 2 โดยมีการปรับปรุงรายละเอียดพื้นผิว (Textures) และงานดีไซน์ตัวละครให้มีความสมจริงและมีชีวิตชีวามากขึ้น เช่น รายละเอียดบนเสื้อผ้าของชาว Kokiri หรือแสงเงาที่ตกกระทบตัว Ocarina นอกจากนี้ยังมีการเพิ่มระบบพากย์เสียงเต็มรูปแบบให้กับตัวละครสำคัญ ซึ่งช่วยเพิ่มอารมณ์ร่วมในฉากคัทซีนได้อย่างยอดเยี่ยม แม้จะมีข้อสังเกตจาก GameSpot ว่าการพากย์เสียงในบางจุดอาจทำให้ความลึกลับของตัวละครอย่าง Sheik ดูลดทอนลงไปบ้างเมื่อเทียบกับข้อจำกัดของเวอร์ชันดั้งเดิม", "ทางด้าน Eurogamer ได้เน้นย้ำถึงการปรับปรุงระบบควบคุมที่เปลี่ยนจากการใช้กล้องแบบล็อคตายตัวในอดีต มาเป็นการใช้ก้านอนาล็อกควบคุมกล้องได้อย่างอิสระ ซึ่งช่วยให้การสำรวจพื้นที่อย่าง Hyrule Castle Town หรือ Zora's Domain มีความลื่นไหลและเป็นธรรมชาติมากขึ้น โดยยังคงโครงสร้างด่านและปริศนาที่ท้าทายไว้เหมือนเดิม ทำให้ผู้เล่นที่เคยผ่านเกมนี้มาแล้วยังคงสนุกไปกับการแก้ปริศนาได้โดยไม่รู้สึกว่าเกมสูญเสียจิตวิญญาณเดิมไป", "โดยสรุปแล้ว การรีเมคครั้งนี้ถือเป็นมาตรฐานใหม่ของการนำเกมคลาสสิกกลับมาทำใหม่ให้เข้ากับยุคสมัย แม้จะมีข้อถกเถียงเล็กน้อยในเรื่องของการตีความตัวละครบางตัว แต่ในภาพรวมถือเป็นผลงานที่ห้ามพลาดสำหรับเจ้าของเครื่อง Switch 2 ทุกคน นี่คือโอกาสอันดีที่จะได้สัมผัสกับจุดเริ่มต้นของตำนาน 3D Zelda ที่ยังคงความสนุกและทรงพลังไม่ต่างจากวันแรกที่วางจำหน่ายเมื่อหลายทศวรรษก่อน"], "link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless/", "canonical_link": "https://www.gamespot.com/reviews/the-zelda-ocarina-of-time-remake-shows-that-a-masterpiece-is-ageless", "cover_image_url": "https://www.gamespot.com/wp-content/uploads/2026/11/LOZ-Deku-Tree.jpg?w=1200", "gallery_images": ["https://assetsio.gnwcdn.com/christian-donlan.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://i.ytimg.com/vi/8BYDYTh4G9s/hqdefault.jpg", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-24.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-6.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-12.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-9.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-8.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp", "https://assetsio.gnwcdn.com/zelda-ocarina-remake-7.jpg?width=1200&height=2048&fit=bounds&quality=85&format=jpg&auto=webp"], "videos": ["https://www.youtube.com/embed/8BYDYTh4G9s"], "review_score": "10", "published_ts": 1793790000, "published_at": "2026-11-04T11:00:00Z", "published_th": "4 พ.ย. 2026 • 18:00 น.", "category_hint": "GlobalReview"}, {"id": 1794814341226, "guid": "1943764", "original_title": "Godzilla: Destroy All Monsters Melee Remastered Is A Faithful, If Flawed, Remaster", "thai_title": "Godzilla: Destroy All Monsters Melee Remastered: ความสนุกระดับตำนานที่ถูกขัดจังหวะด้วยระบบ Grind", "tag": "GlobalReview", "sub_tag": "GAME REVIEW", "source_name": "GameSpot", "sources": [{"name": "GameSpot", "url": "https://www.gamespot.com/reviews/godzilla-destroy-all-monsters-melee-remastered-is-a-faithful-if-flawed-remaster/"}], "bullet_points": ["เกมแนว 3D Brawler ที่คงความสนุกแบบต้นฉบับปี 2002 ไว้ได้อย่างครบถ้วน", "ระบบการเล่นเน้นความบันเทิงแบบ Local Multiplayer ที่เล่นกับเพื่อนได้สูงสุด 4 คน", "จุดอ่อนสำคัญคือระบบปลดล็อกตัวละครที่ต้องใช้การ Grind อย่างหนักผ่านระบบ Research และ Rumors", "มีโหมด Tournament ซ่อนอยู่ในการตั้งค่าที่ช่วยให้เล่นตัวละครได้ครบโดยไม่ต้องปลดล็อก"], "full_paragraphs": ["การกลับมาของ Godzilla: Destroy All Monsters Melee Remastered ถือเป็นการปลุกตำนานเกมต่อสู้ของเหล่าไคจูให้กลับมามีชีวิตอีกครั้ง โดยอ้างอิงข้อมูลจากรีวิวของ GameSpot ระบุว่าตัวเกมยังคงมอบประสบการณ์ความสนุกแบบดั้งเดิมที่แฟนๆ คุ้นเคย ไม่ว่าจะเป็นการจับ Godzilla 2000 ทุ่มใส่ตึก หรือการใช้ Anguirus กระโดดถีบศัตรู ซึ่งความโกลาหลเหล่านี้คือหัวใจหลักที่ทำให้เกมนี้ยังคงเสน่ห์ดึงดูดใจผู้เล่นได้เป็นอย่างดี", "ในแง่ของเกมเพลย์ ตัวเกมยังคงความเรียบง่ายสไตล์อาร์เคดที่เข้าถึงได้ง่าย แม้ตัวละครแต่ละตัวจะมีท่าคอมโบพื้นฐานที่คล้ายคลึงกัน แต่ก็มีการใส่รายละเอียดเฉพาะตัวที่แตกต่างกันไป เช่น ความสามารถในการมุดดินของ Megalon หรือการบล็อกด้วยหลังหนามของ Anguirus ซึ่ง GameSpot มองว่าความหลากหลายเหล่านี้เพียงพอที่จะสร้างสีสันในการต่อสู้ โดยเฉพาะเมื่อเล่นร่วมกับเพื่อนในโหมด Local Multiplayer ที่สร้างเสียงหัวเราะได้ตลอดการเล่น", "อย่างไรก็ตาม สิ่งที่น่าเสียดายตามรายงานของ GameSpot คือระบบการปลดล็อกตัวละครที่เปลี่ยนไปจากต้นฉบับอย่างสิ้นเชิง จากเดิมที่เคยปลดล็อกผ่านโหมด Adventure ได้ง่ายๆ กลายมาเป็นระบบที่ต้องใช้การ Grind ผ่านการเก็บค่าประสบการณ์ (XP), การทำ Research Points และการเคลียร์ภารกิจ Rumors ซึ่งกินเวลานานและสร้างความเหนื่อยล้าให้กับผู้เล่นที่ต้องการเพียงแค่เลือกตัวละครที่ชอบมาเล่นสนุกเท่านั้น", "แม้ตัวเกมจะมีโหมด Tournament ที่ช่วยให้ผู้เล่นสามารถเข้าถึงตัวละครและฉากทั้งหมดได้โดยไม่ต้องผ่านการปลดล็อก แต่โหมดนี้กลับถูกซ่อนไว้อย่างน่าประหลาดในการตั้งค่าและไม่รองรับการเล่นออนไลน์ ทำให้ผู้เล่นยังคงต้องเผชิญกับระบบ Progression ที่ดูเหมือนเกม Live-Serv //jp.ign.com/monster-hunter-outlanders/84598/"}], "bullet_points": ["นำเสนอประสบการณ์ Monster Hunter แบบฉบับสมบูรณ์ลงสู่หน้าจอมือถือได้อย่างน่าประทับใจ", "ระบบการเล่นเน้นความกระชับและเข้าถึงง่าย โดยได้รับอิทธิพลการออกแบบมาจาก Monster Hunter: World", "โดดเด่นด้วยกราฟิกที่สวยงามและประสิทธิภาพการรันเกมที่ลื่นไหลบนสมาร์ทโฟน", "ระบบการจัดการทรัพยากรและกลไกกาชาที่ซับซ้อนเกินจำเป็น กลายเป็นอุปสรรคต่อจังหวะการเล่น"], "full_paragraphs": ["การนำซีรีส์นักล่ามังกรระดับตำนานมาสู่แพลตฟอร์มพกพาอย่าง Monster Hunter Outlanders ถือเป็นความท้าทายครั้งใหญ่ ล่าสุดทาง IGN Japan ได้เผยบทวิเคราะห์ที่น่าสนใจว่า แม้ตัวเกมจะสามารถถ่ายทอดจิตวิญญาณการล่าอันเป็นเอกลักษณ์มาไว้บนสมาร์ทโฟนได้อย่างครบถ้วน แต่ในขณะเดียวกันก็ต้องเผชิญกับข้อจำกัดของระบบเกมมือถือยุคใหม่ที่หนีไม่พ้นกลไกการสุ่มตัวละครหรือกาชา ซึ่งส่งผลกระทบต่อประสบการณ์การเล่นโดยรวมอย่างหลีกเลี่ยงไม่ได้", "ในแง่ของเกมเพลย์ ตัวเกมเปรียบเสมือนการย่อส่วนความสนุกจาก Monster Hunter: World มาไว้ในมือถือ โดยผู้เล่นจะได้ออกสำรวจเกาะ Isolesia ที่เต็มไปด้วยมอนสเตอร์และทรัพยากรมากมาย ระบบการต่อสู้ถูกปรับให้เข้ากับหน้าจอสัมผัสด้วยโหมดการควบคุมที่หลากหลาย ทั้งแบบ 'Starting' ที่เน้นความเรียบง่ายอัตโนมัติ และ 'Classic' สำหรับผู้ที่ต้องการความแม่นยำสูง นอกจากนี้ยังมีระบบปาร์ตี้ที่ให้ผู้เล่นสลับตัวละครที่มีทักษะเฉพาะตัวมาใช้งาน ซึ่งช่วยเพิ่มสีสันและความหลากหลายในการล่าได้เป็นอย่างดี", "จุดที่น่าชื่นชมที่สุดตามรายงานของ IGN Japan คือคุณภาพกราฟิกและสเกลของโลกที่ทำออกมาได้ยอดเยี่ยม โดยสามารถรันบนสมาร์ทโฟนได้อย่างลื่นไหลและเสถียร อย่างไรก็ตาม ปัญหาใหญ่ที่ผู้เล่นต้องเผชิญคือความซับซ้อนของระบบบริหารจัดการทรัพยากรที่มีมากเกินไป ทั้งระบบเลเวลตัวละคร, การอัปเกรดอุปกรณ์, ระบบ 'Souvenir' และการเก็บสะสมการ์ด 'Picture' ซึ่งทำให้ผู้เล่นต้องเสียเวลาไปกับการจัดการเมนูมากกว่าการออกไปล่ามอนสเตอร์จริง", "แม้ในช่วง 30 ชั่วโมงแรกตัวเกมจะมอบประสบการณ์ที่สนุกและไม่บีบบังคับเรื่องการเติมเงิน แต่เมื่อเข้าสู่ช่วงท้ายเกม ผู้เล่นจะเริ่มสัมผัสได้ถึงกำแพงความยากที่ต้องอาศัยการฟาร์มหรือการใช้ทรัพยากรจากระบบกาชาเข้ามาช่วย การที่ตัวเกมต้องพึ่งพาระบบเหล่านี้มากเกินไปทำให้จังหวะการเล่นที่ค       if (!btn || !icon || !label) return;
      if (isSpeaking) {
        icon.textContent = '⏹';
        label.textContent = 'หยุด';
        btn.className = 'px-2.5 py-1 text-xs font-mono font-bold text-[#ff3366] hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1';
      } else {
        icon.textContent = '🔊';
        label.textContent = 'ฟังข่าว';
        btn.className = 'px-2.5 py-1 text-xs font-mono font-bold text-emerald-400 hover:text-white hover:bg-zinc-800 rounded-full transition flex items-center gap-1';
      }
    }

    function stopSpeech() {
      speechSessionId++;
      isSpeaking = false;
      speechQueue = [];
      currentSpeechStep = 0;
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      highlightSpeakingParagraph(-1);
      updateTtsButtonUI();
    }

    function speakCurrentStep(sessionId) {
      if (!isSpeaking || sessionId !== speechSessionId || currentSpeechStep >= speechQueue.length) {
        if (sessionId === speechSessionId) stopSpeech();
        return;
      }
      const stepItem = speechQueue[currentSpeechStep];
      highlightSpeakingParagraph(stepItem.paraIdx);

      const u = new SpeechSynthesisUtterance(stepItem.text);
      u.lang = 'th-TH';
      u.rate = SPEECH_RATES[speechRateIdx] || 1.0;
      const thVoice = getThaiVoice();
      if (thVoice) u.voice = thVoice;

      u.onend = () => {
        if (sessionId === speechSessionId && isSpeaking) {
          currentSpeechStep++;
          speakCurrentStep(sessionId);
        }
      };
      u.onerror = (e) => {
        if (e && e.error === 'interrupted') return;
        if (sessionId === speechSessionId && isSpeaking) {
          currentSpeechStep++;
          speakCurrentStep(sessionId);
        }
      };
      window.speechSynthesis.speak(u);
    }

    function startSpeech(resumeStep = 0) {
      if (!('speechSynthesis' in window) || !currentModalItem) return;
      window.speechSynthesis.cancel();
      speechSessionId++;
      const sessionId = speechSessionId;

      speechQueue = [];
      const headline = (currentModalItem.thai_title || currentModalItem.original_title || '').trim();
      if (headline) {
        speechQueue.push({ text: headline, paraIdx: -1 });
      }
      const bodyParas = Array.isArray(currentModalItem.full_paragraphs) ? currentModalItem.full_paragraphs : [];
      bodyParas.forEach((p, idx) => {
        if (p && String(p).trim()) {
          speechQueue.push({ text: String(p).trim(), paraIdx: idx });
        }
      });

      if (speechQueue.length === 0) return;
      currentSpeechStep = Math.max(0, Math.min(resumeStep, speechQueue.length - 1));
      isSpeaking = true;
      updateTtsButtonUI();
      speakCurrentStep(sessionId);
    }

    function toggleSpeech() {
      if (isSpeaking) {
        stopSpeech();
      } else {
        startSpeech(0);
      }
    }

    function cycleSpeechRate() {
      speechRateIdx = (speechRateIdx + 1) % SPEECH_RATES.length;
      const rateBtn = document.getElementById('ttsRateBtn');
      if (rateBtn) rateBtn.textContent = SPEECH_RATES[speechRateIdx] + 'x';
      if (isSpeaking) {
        startSpeech(currentSpeechStep);
      }
    }

    window.addEventListener('beforeunload', () => stopSpeech());

    function applyFontSize() {
      const step = FONT_STEPS[currentFontIdx] || FONT_STEPS[1];
      const fullEl = document.getElementById('modalFullContent');
      const bulletEl = document.getElementById('modalBullets');
      const titleEl = document.getElementById('modalTitle');
      const labelEl = document.getElementById('fontSizeLabel');
      if (fullEl) fullEl.style.fontSize = step.body;
      if (bulletEl) bulletEl.style.fontSize = step.bullet;
      if (titleEl) titleEl.style.fontSize = step.title;
      if (labelEl) labelEl.textContent = step.pct;
    }

    function changeFontSize(delta) {
      const next = Math.max(0, Math.min(FONT_STEPS.length - 1, currentFontIdx + delta));
      if (next !== currentFontIdx) {
        currentFontIdx = next;
        try { localStorage.setItem('pureGamerFontIdx', String(currentFontIdx)); } catch (e) {}
        applyFontSize();
      }
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function handleImgError(img, tag) {
      const step = parseInt(img.getAttribute('data-fb-step') || '0', 10);
      if (step === 0) {
        img.setAttribute('data-fb-step', '1');
        img.src = CATEGORY_FALLBACKS[tag] || CATEGORY_FALLBACKS.GlobalNews;
      } else {
        img.onerror = null;
        img.src = SVG_FALLBACK_URI;
      }
    }

    function handleGalleryImgError(img) {
      img.onerror = null;
      const wrapper = img.parentElement;
      if (wrapper) wrapper.remove();
      const grid = document.getElementById('modalGalleryGrid');
      const sec = document.getElementById('modalGallerySection');
      if (grid && sec && grid.children.length === 0) {
        sec.classList.add('hidden');
      }
    }

    async function refreshLiveNews(btn) {
      const svg = btn ? btn.querySelector('svg') : null;
      if (svg) svg.classList.add('animate-spin');
      try {
        const r = await fetch('data/news.json?t=' + Date.now(), { cache: 'no-store' });
        if (r.ok) {
          const data = await r.json();
          if (Array.isArray(data) && data.length > 0) {
            allNews = data;
            render();
          }
        }
      } catch (err) {
      } finally {
        if (svg) svg.classList.remove('animate-spin');
      }
    }

    function filterTag(tag) {
      currentTag = tag;
      ['ALL', 'GlobalNews', 'JapanNews', 'GlobalReview', 'JapanReview'].forEach(t => {
        const btn = document.getElementById('filter' + t);
        if (btn) {
          if (t === tag) {
            btn.className = "px-3.5 py-1.5 bg-white text-black font-mono font-bold text-xs rounded transition whitespace-nowrap";
          } else {
            let textColor = 'text-zinc-300';
            if (t === 'GlobalNews') textColor = 'text-cyan-400';
            if (t === 'JapanNews') textColor = 'text-[#ff3366]';
            if (t === 'GlobalReview') textColor = 'text-purple-400';
            if (t === 'JapanReview') textColor = 'text-amber-400';
            btn.className = `px-3.5 py-1.5 bg-zinc-900 hover:bg-zinc-800 ${textColor} font-mono text-xs rounded transition whitespace-nowrap`;
          }
        }
      });
      render();
      window.scrollTo({ top: 0, left: 0, behavior: 'instant' });
    }

    function formatSourceNames(item) {
      const srcs = Array.isArray(item.sources) && item.sources.length > 0
        ? item.sources.map(s => s.name).filter(Boolean)
        : [item.source_name || 'SOURCE'];
      return [...new Set(srcs)].join(' + ');
    }

    function render() {
      const grid = document.getElementById('newsGrid');
      grid.innerHTML = '';

      const filtered = allNews
        .filter(item => (currentTag === 'ALL') || (item.tag === currentTag))
        .slice()
        .sort((a, b) => (b.published_ts || 0) - (a.published_ts || 0));

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="col-span-3 text-center py-16 text-zinc-500 font-mono">ไม่มีข่าวในหมวดนี้</div>';
        return;
      }

      filtered.forEach((item, cardIdx) => {
        const originalIndex = allNews.indexOf(item);
        const div = document.createElement('div');
        div.className = 'bg-zinc-900/50 border border-zinc-800 hover:border-zinc-700 transition flex flex-col justify-between overflow-hidden rounded cursor-pointer group';
        div.onclick = () => openModal(originalIndex);
        
        const bulletsHtml = (item.bullet_points || []).slice(0, 3).map(b => 
          `<li class="flex items-start gap-1.5"><span class="text-[#ff3366] font-bold">›</span><span>${escapeHtml(b)}</span></li>`
        ).join('');

        let tagColor = 'text-cyan-400';
        if (item.tag === 'JapanNews') tagColor = 'text-[#ff3366]';
        else if (item.tag === 'GlobalReview') tagColor = 'text-purple-400';
        else if (item.tag === 'JapanReview') tagColor = 'text-amber-400';

        const reviewBadge = item.review_score ? `<div class="absolute top-2.5 right-2.5 bg-[#ff3366] text-white font-mono font-extrabold text-xs px-2.5 py-1 rounded shadow-lg border border-white/20">⭐ ${escapeHtml(item.review_score)} / 10</div>` : '';
        const imgSrc = item.cover_image_url || CATEGORY_FALLBACKS[item.tag] || CATEGORY_FALLBACKS.GlobalNews;
        const loadingAttr = cardIdx < 6 ? 'eager' : 'lazy';
        const safeTag = escapeHtml(item.tag || '');
        const safeCatLabel = escapeHtml(CATEGORY_LABELS[item.tag] || item.tag || '');
        const safeSubTag = escapeHtml(item.sub_tag || '');
        const subTagBadge = safeSubTag ? `<span class="px-1.5 py-0.5 rounded bg-zinc-800/90 text-zinc-200 border border-zinc-700/80 text-[10px] font-mono font-semibold tracking-wide uppercase">${safeSubTag}</span>` : '';
        const safeSources = escapeHtml(formatSourceNames(item));
        const safeDate = escapeHtml(item.published_th || item.published_at || '');
        const safeTitle = escapeHtml(item.thai_title || item.original_title || '');

        div.innerHTML = `
          <div>
            <div class="w-full aspect-video overflow-hidden bg-zinc-950 relative">
              <img src="${escapeHtml(imgSrc)}" data-tag="${safeTag}" referrerpolicy="no-referrer" loading="${loadingAttr}" decoding="async" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="handleImgError(this, this.dataset.tag)">
              ${reviewBadge}
            </div>
            <div class="p-5">
              <div class="flex items-center flex-wrap gap-1.5 text-[11px] font-mono mb-2.5">
                <span class="${tagColor} font-bold uppercase">${safeCatLabel}</span>
                ${subTagBadge}
                <span class="text-zinc-600">•</span>
                <span class="text-zinc-500">${safeDate}</span>
              </div>
              <h3 class="brand-title text-base font-bold text-white group-hover:text-[#ff3366] transition mb-3 leading-snug line-clamp-2">
                ${safeTitle}
              </h3>
              <ul class="text-xs text-zinc-300 space-y-1.5 font-light">
                ${bulletsHtml}
              </ul>
            </div>
          </div>
          <div class="p-5 pt-3 border-t border-zinc-800/80 text-[11px] font-mono text-zinc-500 flex items-center justify-between gap-2">
            <span class="text-zinc-300 group-hover:text-white transition shrink-0">อ่านบทความ →</span>
            <span class="px-2 py-0.5 rounded bg-emerald-950/50 text-emerald-300 border border-emerald-800/50 truncate">📰 ${safeSources}</span>
          </div>
        `;
        grid.appendChild(div);
      });
    }

    function openModal(idx) {
      const item = allNews[idx];
      if (!item) return;

      stopSpeech();
      currentModalItem = item;
      const ttsWrap = document.getElementById('ttsControls');
      if (ttsWrap && !('speechSynthesis' in window)) {
        ttsWrap.classList.add('hidden');
      }

      isModalOpen = true;
      history.pushState({ modalOpen: true, newsId: item.id }, '', '#news-' + item.id);

      document.getElementById('modalTag').textContent = CATEGORY_LABELS[item.tag] || item.tag || '';
      const modalSubTag = document.getElementById('modalSubTag');
      if (modalSubTag) {
        if (item.sub_tag) {
          modalSubTag.textContent = item.sub_tag;
          modalSubTag.classList.remove('hidden');
        } else {
          modalSubTag.classList.add('hidden');
          modalSubTag.textContent = '';
        }
      }
      const modalSourceBadges = document.getElementById('modalSourceBadges');
      if (modalSourceBadges) {
        modalSourceBadges.textContent = '📰 อ้างอิง: ' + formatSourceNames(item);
        modalSourceBadges.classList.remove('hidden');
      }

      const modalImg = document.getElementById('modalImg');
      modalImg.onerror = null;
      modalImg.src = TRANSPARENT_GIF;
      modalImg.setAttribute('data-fb-step', '0');
      modalImg.onerror = () => handleImgError(modalImg, item.tag);
      modalImg.src = item.cover_image_url || CATEGORY_FALLBACKS[item.tag] || SVG_FALLBACK_URI;

      const scoreBadge = document.getElementById('modalScoreBadge');
      if (scoreBadge) {
        if (item.review_score) {
          scoreBadge.textContent = `⭐ ${item.review_score} / 10`;
          scoreBadge.classList.remove('hidden');
        } else {
          scoreBadge.classList.add('hidden');
          scoreBadge.textContent = '';
        }
      }

      document.getElementById('modalTitle').textContent = item.thai_title || item.original_title || '';
      document.getElementById('modalDate').textContent = item.published_th || item.published_at || '';

      const bulletsList = document.getElementById('modalBullets');
      bulletsList.innerHTML = '';
      (item.bullet_points || []).forEach(b => {
        const li = document.createElement('li');
        li.className = 'flex items-start gap-2';
        li.innerHTML = `<span class="text-[#ff3366] font-bold">›</span><span>${escapeHtml(b)}</span>`;
        bulletsList.appendChild(li);
      });

      const videoSec = document.getElementById('modalVideoSection');
      const videoContainer = document.getElementById('modalVideoContainer');
      videoContainer.innerHTML = '';
      if (Array.isArray(item.videos) && item.videos.length > 0) {
        videoSec.classList.remove('hidden');
        item.videos.forEach(vUrl => {
          const wrap = document.createElement('div');
          wrap.className = 'w-full aspect-video rounded-md overflow-hidden border border-zinc-800 bg-black shadow-lg';
          wrap.innerHTML = `<iframe src="${escapeHtml(vUrl)}?rel=0" class="w-full h-full" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>`;
          videoContainer.appendChild(wrap);
        });
      } else {
        videoSec.classList.add('hidden');
      }

      const fullContentDiv = document.getElementById('modalFullContent');
      fullContentDiv.innerHTML = '';
      const paras = Array.isArray(item.full_paragraphs) && item.full_paragraphs.length > 0 ? item.full_paragraphs : (item.bullet_points || []);
      const images = Array.isArray(item.gallery_images) ? item.gallery_images.slice() : [];
      const maxInline = Math.min(images.length, 4);
      const step = maxInline > 0 ? Math.max(2, Math.floor(paras.length / (maxInline + 1))) : 0;
      let inlineUsedCount = 0;

      paras.forEach((p, pIdx) => {
        const pElem = document.createElement('p');
        pElem.setAttribute('data-para-idx', String(pIdx));
        pElem.className = 'transition-all duration-200';
        pElem.textContent = p;
        fullContentDiv.appendChild(pElem);

        if (step > 0 && inlineUsedCount < maxInline && (pIdx + 1) % step === 0 && (pIdx + 1) < paras.length) {
          const imgUrl = images[inlineUsedCount++];
          const fig = document.createElement('figure');
          fig.className = 'my-5 rounded-md overflow-hidden border border-zinc-800 bg-zinc-950';
          fig.innerHTML = `<a href="${escapeHtml(imgUrl)}" target="_blank" rel="noopener noreferrer" class="block aspect-video overflow-hidden group"><img src="${escapeHtml(imgUrl)}" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="this.closest('figure').remove()" class="w-full h-full object-cover group-hover:scale-105 transition duration-500"></a>`;
          fullContentDiv.appendChild(fig);
        }
      });

      const gallerySec = document.getElementById('modalGallerySection');
      const galleryGrid = document.getElementById('modalGalleryGrid');
      galleryGrid.innerHTML = '';
      const remainingImages = images.slice(inlineUsedCount);
      if (remainingImages.length > 0) {
        gallerySec.classList.remove('hidden');
        remainingImages.forEach(imgUrl => {
          const a = document.createElement('a');
          a.href = imgUrl;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'block aspect-video overflow-hidden rounded bg-zinc-950 border border-zinc-800 hover:border-[#ff3366] transition group relative';
          a.innerHTML = `<img src="${escapeHtml(imgUrl)}" referrerpolicy="no-referrer" loading="lazy" decoding="async" onerror="handleGalleryImgError(this)" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">`;
          galleryGrid.appendChild(a);
        });
      } else {
        gallerySec.classList.add('hidden');
      }

      const sourcesListEl = document.getElementById('modalSourcesList');
      sourcesListEl.innerHTML = '';
      const srcs = Array.isArray(item.sources) && item.sources.length > 0
        ? item.sources
        : [{ name: item.source_name || 'ต้นฉบับ', url: item.link || '#' }];
      srcs.forEach(src => {
        const a = document.createElement('a');
        a.href = src.url || '#';
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.className = 'px-3 py-1.5 bg-zinc-900 border border-zinc-700 text-xs font-mono text-white rounded-sm hover:bg-zinc-800 hover:border-[#ff3366] flex items-center gap-1.5 transition';
        a.innerHTML = `<span>อ่านต้นฉบับที่ ${escapeHtml(src.name || 'Source')}</span><span>↗</span>`;
        sourcesListEl.appendChild(a);
      });

      applyFontSize();
      
      const modalOverlay = document.getElementById('modalOverlay');
      const modalBody = document.getElementById('modalBody');
      modalOverlay.classList.remove('hidden');
      document.body.style.overflow = 'hidden';

      modalOverlay.scrollTop = 0;
      if (modalBody) modalBody.scrollTop = 0;
      requestAnimationFrame(() => {
        modalOverlay.scrollTop = 0;
        if (modalBody) modalBody.scrollTop = 0;
      });
    }

    function closeModal(fromHistory = false) {
      if (!isModalOpen) return;
      isModalOpen = false;
      stopSpeech();
      currentModalItem = null;
      document.getElementById('modalVideoContainer').innerHTML = '';
      document.getElementById('modalOverlay').classList.add('hidden');
      document.body.style.overflow = '';

      if (!fromHistory && history.state && history.state.modalOpen) {
        history.back();
      }
    }

    window.addEventListener('popstate', () => {
      if (isModalOpen) {
        closeModal(true);
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && isModalOpen) {
        closeModal();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const hash = window.location.hash;
      if (hash && hash.startsWith('#news-')) {
        const newsId = hash.replace('#news-', '');
        const idx = allNews.findIndex(n => String(n.id) === newsId);
        if (idx !== -1) {
          openModal(idx);
        }
      }
    });

    render();
  </script>
</body>
</html>
